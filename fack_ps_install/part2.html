<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单查询</title>
    <style>
        /* 继承全局基础样式，保持一致性 */
        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .container {
            width: 800px;
            margin: 0 auto;
        }

        /* ========== 新增：模态遮罩层样式 ========== */
        #modalOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5); /* 半透明黑色遮罩 */
            z-index: 9999; /* 层级最高，覆盖所有内容 */
            display: none; /* 默认隐藏 */
            pointer-events: auto; /* 拦截点击事件，阻止穿透到主界面 */
        }

        /* 返回按钮样式 */
        .back-btn {
            display: inline-block;
            padding: 8px 16px;
            font-size: 14px;
            border: 1px solid #ccc;
            background-color: #fff;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .back-btn:hover {
            background-color: #f5f5f5;
        }

        /* 查询区域样式 */
        .search-wrap {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 4px rgba(138, 138, 138, 0.3);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .search-wrap label {
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }

        .order-input {
            flex: 1;
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
            width: 50%;
        }

        .order-input:focus {
            border-color: #2196f3;
        }

        .search-btn {
            padding: 8px 20px;
            font-size: 14px;
            background-color: #2196f3;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .search-btn:hover {
            background-color: #1976d2;
        }

        /* 订单表格样式 */
        .order-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 4px rgba(138, 138, 138, 0.3);
        }

        .order-table th,
        .order-table td {
            padding: 12px 15px;
            font-size: 14px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .order-table th {
            background-color: #f8f8f8;
            color: #333;
            font-weight: bold;
        }

        .order-table tbody tr:hover {
            background-color: #fafafa;
        }

        /* 暂无订单样式 */
        .no-order {
            color: #666;
            font-size: 14px;
            padding: 40px 0;
        }

        /* 操作按钮样式 */
        .operate-btn {
            padding: 4px 8px;
            font-size: 12px;
            color: #2196f3;
            background-color: transparent;
            border: 1px solid #2196f3;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .operate-btn:hover {
            background-color: #2196f3;
            color: #fff;
        }

        /* 适配响应式（保持800宽度适配） */
        @media (max-width: 1360px) {
            .container {
                width: 780px !important;
            }
        }
    </style>
</head>

<body>
    <!-- ========== 新增：模态遮罩层 DOM 元素 ========== -->
    <div id="modalOverlay"></div>

    <script src="js/neutralino.js"></script>
    <!-- <script src="/js/main.js"></script> -->
    <div class="container">
        <div class="search-wrap">
            <button class="back-btn">返回</button>
            <div style="width: 60%;">
                <!-- 修改标签文本为订单号/手机号 -->
                <label for="orderNum">订单号/手机号：</label>
                <!-- 更新placeholder提示格式规则 -->
                <input type="text" id="orderNum" class="order-input" placeholder="请输入订单号或手机号查询">
                <button class="search-btn">查询</button>
            </div>
        </div>

        <table class="order-table">
            <thead>
                <tr>
                    <th>订单编号</th>
                    <th>购买产品</th>
                    <th>购买日期</th>
                    <th>支付价格</th>
                    <th>支付方式</th>
                </tr>
            </thead>
            <tbody id="orderTableBody">
                <tr>
                    <td colspan="4" class="no-order">暂无订单</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        Neutralino.init();
        // 模拟订单数据（新增手机号关联，方便测试）
        const mockOrders = [
            {
                orderNum: '1234567890123456789012345678', // 28位数字订单号
                name: '植物大战僵尸', // 关联手机号
                time: '2026-01-07 10:25',
                amount: '199',
                status: 'wx'
            },
        ];

        // ========== 新增：封装模态版 showMessageBox 函数 ==========
        async function showModalMessageBox(title, content, choice = 'OK', icon = 'INFO') {
            const overlay = document.getElementById('modalOverlay');
            // 1. 显示遮罩层，锁住主界面交互
            overlay.style.display = 'block';
            document.body.style.pointerEvents = 'none'; // 禁用body点击

            try {
                // 2. 调用 Neutralino 原生消息框
                const result = await Neutralino.os.showMessageBox(title, content, choice, icon);
                return result; // 返回用户点击的按钮（如 'OK'/'YES'/'NO'）
            } catch (error) {
                console.error('消息框调用失败：', error);
                return null;
            } finally {
                // 3. 无论是否成功，关闭对话框后恢复主界面交互
                overlay.style.display = 'none';
                document.body.style.pointerEvents = 'auto'; // 恢复body点击
            }
        }

        // 返回按钮逻辑
        document.querySelector('.back-btn').addEventListener('click', function () {
            window.history.back();
        });

        // 格式校验函数：校验是否为28位订单号或11位手机号
        function validateInput(inputValue) {
            // 订单号规则：28位纯数字
            const orderNumReg = /^\d{28}$/;
            // 手机号规则：11位纯数字，以1开头
            const phoneReg = /^1\d{10}$/;

            if (orderNumReg.test(inputValue)) {
                return { valid: true, type: 'orderNum' }; // 校验通过，类型为订单号
            } else if (phoneReg.test(inputValue)) {
                return { valid: true, type: 'phone' }; // 校验通过，类型为手机号
            } else {
                return { valid: false }; // 校验不通过
            }
        }

        // 渲染订单表格的函数
        function renderOrderTable(orderData) {
            const tableBody = document.getElementById('orderTableBody');
            // 清空原有内容
            tableBody.innerHTML = '';

            if (!orderData) {
                // 无匹配订单
                tableBody.innerHTML = '<tr><td colspan="4" class="no-order">未查询到该订单</td></tr>';
                return;
            }

            // 生成订单行
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${orderData.orderNum}</td>
                <td>${orderData.name}</td>
                <td>${orderData.time}</td>
                <td>${orderData.amount}</td>
                <td>${orderData.status}</td>

            `;
            tableBody.appendChild(tr);
        }

        // 查询按钮逻辑（修改：替换原有 alert 和普通 showMessageBox 为模态版）
        document.querySelector('.search-btn').addEventListener('click', async function () {
            const inputValue = document.querySelector('.order-input').value.trim();

            // 1. 校验是否为空
            if (!inputValue) {
                // 改用模态消息框替代原生 alert
                await showModalMessageBox('提示', '请输入订单号或手机号', 'OK', 'INFO');
                return;
            }

            // 2. 校验格式
            const validateResult = validateInput(inputValue);
            if (!validateResult.valid) {
                // 改用模态消息框提示格式错误
                await showModalMessageBox(
                    '格式错误',
                    '输入格式错误！请输入28位纯数字订单号或11位有效手机号',
                    'OK',
                    'ERROR'
                );
                return;
            }

            let matchedOrder;
            if (validateResult.type === 'orderNum') {
                matchedOrder = mockOrders.find(item => item.orderNum === inputValue);
            } else {
                matchedOrder = mockOrders.find(item => item.phone === inputValue);
            }

            // 4. 渲染表格
            renderOrderTable(matchedOrder);
            console.log('查询内容：', inputValue, '匹配结果：', matchedOrder);
        });

        document.addEventListener('DOMContentLoaded', function () {
            // 移除原有可能的监听，重新绑定
            Neutralino.events.off("windowClose");
            Neutralino.events.on("windowClose", async () => {
                try {
                    const shouldShow = shouldShowDiscountPopup();
                    if (!shouldShow) {
                        Neutralino.app.exit();
                    } else {
                        Neutralino.app.exit();
                    }
                } catch (e) {
                    Neutralino.app.exit();
                }
            });
        });
    </script>
</body>

</html>
